[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nest-authz"
version = "0.1.0"
description = "Deterministic authorization domain types for autonomous agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography==50.0.1"]

[project.optional-dependencies]
nandatown = ["nandatown>=0.2,<0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nest_authz.integrations.nandatown" = ["*.yaml"]
