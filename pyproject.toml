[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nest-authz"
version = "0.1.0"
description = "Deterministic authorization, delegated authority, and execution evidence for autonomous agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography==50.0.1"]
keywords = [
    "authorization",
    "autonomous-agents",
    "delegation",
    "security",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

[project.urls]
Repository = "https://github.com/shanurwan/nest-authz"
Issues = "https://github.com/shanurwan/nest-authz/issues"

[project.optional-dependencies]
nandatown = ["nandatown>=0.2,<0.3"]
dev = [
    "build>=1.2,<2",
    "coverage[toml]>=7.6,<8",
    "mypy>=1.11,<2",
    "pip-audit>=2.7,<3",
    "ruff>=0.14,<1",
    "twine>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nest_authz.integrations.nandatown" = ["*.yaml"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "S", "UP"]
# Replacing established ``str, Enum`` bases with StrEnum changes public string
# rendering; defer that compatibility decision beyond v0.1 release hardening.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
"src/nest_authz/canonical.py" = ["S324"]
"src/nest_authz/integrations/nandatown/plugin.py" = ["S105"]
"tests/**/*.py" = ["S101", "S603"]

[tool.mypy]
python_version = "3.11"
files = ["src/nest_authz"]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["nandatown.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["nest_authz"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
fail_under = 75
